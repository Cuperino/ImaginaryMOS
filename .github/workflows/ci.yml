#
# M0 CI skeleton: a green build matrix across the six official targets
# (build-only where the platform can't run our tests) plus lint and
# fixtures-freshness gates. Deeper suites (fuzz, soak, coverage upload,
# packaging) are added by later milestones.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"  # nightly extended fuzzing (plan §10)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Native build + test (Linux, macOS, Windows) --------------------
  build-test:
    name: build+test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  preset: linux,   cc: gcc,   cxx: g++ }
          - { name: linux-clang, os: ubuntu-latest,  preset: linux,   cc: clang, cxx: clang++ }
          - { name: linux-asan,  os: ubuntu-latest,  preset: linux-asan, cc: clang, cxx: clang++ }
          - { name: macos,       os: macos-latest,   preset: macos }
          - { name: windows,     os: windows-latest, preset: windows }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"; echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # --- Cross-compile build-only (Android, iOS, WebAssembly) -----------
  build-android:
    name: build android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: lukka/get-cmake@latest
      - name: Configure + build
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cmake --preset android
          cmake --build --preset android

  build-wasm:
    name: build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: lukka/get-cmake@latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
      - name: Configure + build
        run: |
          cmake --preset wasm
          cmake --build --preset wasm

  build-ios:
    name: build ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: lukka/get-cmake@latest
      - name: Configure + build
        run: |
          cmake --preset ios
          cmake --build --preset ios

  # --- Fuzzers: smoke on PRs, extended nightly (plan §10) --------------
  fuzz:
    name: fuzz ${{ github.event_name == 'schedule' && '(nightly)' || '(smoke)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - name: Configure + build
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz
      - name: Smoke (ctest fuzz targets + unit suites under ASan)
        run: ctest --preset linux-fuzz
      - name: Extended run (nightly only)
        if: github.event_name == 'schedule'
        run: |
          bin=build/linux-fuzz/bin
          for f in imos_fuzz_xml_ingest imos_fuzz_deframer imos_fuzz_store_recovery; do
            corpus=""
            [ "$f" = imos_fuzz_xml_ingest ] && corpus=fixtures/spec-examples
            "$bin/$f" -max_total_time=900 -max_len=65536 -print_final_stats=1 $corpus
          done

  # --- Lint: formatting + fixtures freshness --------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install clang-format
        run: pipx install "clang-format~=21.1"
      - name: Check formatting
        run: |
          files=$(find core imos incs capi store transports tools tests -type f \
            \( -name '*.cpp' -o -name '*.h' \) -not -path '*/gen/*')
          clang-format --dry-run --Werror $files
      - name: Check generated code is up to date with the schemas
        run: |
          python3 tools/codegen/gen_messages.py fixtures/schema/mos4.dtd \
            tools/codegen/annotations.json core
          git diff --exit-code -- core \
            || { echo "::error::generated code is stale; rerun tools/codegen/gen_messages.py"; exit 1; }
      - name: Check fixtures are up to date with the spec
        run: |
          python3 tools/extract_fixtures.py "reference/MOS Protocol 4.0 (Current).html" fixtures
          git diff --exit-code -- fixtures \
            || { echo "::error::fixtures are stale; regenerate with tools/extract_fixtures.py"; exit 1; }
