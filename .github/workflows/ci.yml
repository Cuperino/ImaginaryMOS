#
# CI matrix across the six official targets (build-only where the platform
# can't run our tests) plus lint and fixtures-freshness gates. M2 additions:
# the linux-tls job runs the wss certificate-policy suite, and the wasm job
# drives the WASM P0 smoke under node against a native build. Deeper suites
# (soak, packaging) are added by later milestones. M5 adds the coverage
# job (the ≥90% core/ line gate + conformance-matrix artifact, plan §10).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"  # nightly extended fuzzing (plan §10)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Native build + test (Linux, macOS, Windows) --------------------
  build-test:
    name: build+test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  preset: linux,   cc: gcc,   cxx: g++ }
          - { name: linux-clang, os: ubuntu-latest,  preset: linux,   cc: clang, cxx: clang++ }
          - { name: linux-asan,  os: ubuntu-latest,  preset: linux-asan, cc: clang, cxx: clang++ }
          - { name: linux-tls,   os: ubuntu-latest,  preset: linux-tls, cc: gcc,  cxx: g++ }
          - { name: macos,       os: macos-latest,   preset: macos }
          - { name: windows,     os: windows-latest, preset: windows }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install OpenSSL headers (TLS build)
        if: matrix.preset == 'linux-tls'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev openssl
      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"; echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # --- Cross-compile build-only (Android, iOS, WebAssembly) -----------
  build-android:
    name: build android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: lukka/get-cmake@latest
      - name: Configure + build
        run: |
          # ANDROID_NDK_LATEST_HOME is a runner process env var, not visible to
          # the ${{ env }} expression context; export it so the android preset's
          # toolchainFile ($env{ANDROID_NDK}) resolves at configure time.
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using Android NDK at: $ANDROID_NDK"
          cmake --preset android
          cmake --build --preset android

  build-wasm:
    name: wasm build + node P0 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: lukka/get-cmake@latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
      - name: Configure + build (wasm)
        run: |
          cmake --preset wasm
          cmake --build --preset wasm
      - name: Configure + build (native host for the smoke server)
        run: |
          cmake --preset linux
          cmake --build --preset linux
      - name: WASM Profile 0 smoke under node (plan §13 M2 exit criteria)
        # EMSDK is exported by setup-emsdk; the test finds the wasm artifact
        # in build/wasm and a WebSocket-capable node (emsdk's bundled node
        # via --experimental-websocket, or PATH node ≥ 22).
        env:
          IMOS_REQUIRE_WASM_SMOKE: "1"
        run: ctest --preset linux -R Ws40Transport.WasmClientProfile0Smoke --output-on-failure

  build-ios:
    name: build ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: lukka/get-cmake@latest
      - name: Configure + build
        run: |
          cmake --preset ios
          cmake --build --preset ios

  # --- Fuzzers: smoke on PRs, extended nightly (plan §10) --------------
  fuzz:
    name: fuzz ${{ github.event_name == 'schedule' && '(nightly)' || '(smoke)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - name: Configure + build
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz
      - name: Smoke (ctest fuzz targets + unit suites under ASan)
        run: ctest --preset linux-fuzz
      - name: Extended run (nightly only)
        if: github.event_name == 'schedule'
        # libFuzzer writes discoveries into the FIRST corpus dir, so a
        # scratch dir comes first and the fixtures stay a read-only seed.
        run: |
          bin=build/linux-fuzz/bin
          for f in imos_fuzz_xml_ingest imos_fuzz_deframer imos_fuzz_store_recovery \
                   imos_fuzz_ws40_url imos_fuzz_fqid imos_fuzz_object_query; do
            scratch="build/linux-fuzz/nightly-corpus/$f"
            mkdir -p "$scratch"
            seeds=""
            [ "$f" = imos_fuzz_xml_ingest ] && seeds=fixtures/spec-examples
            [ "$f" = imos_fuzz_object_query ] && seeds="fixtures/spec-examples tests/fuzz/seeds/object_query"
            "$bin/$f" -max_total_time=900 -max_len=65536 -print_final_stats=1 "$scratch" $seeds
          done

  # --- Coverage gate + conformance matrix (M5 exit criteria, plan §10) --
  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - name: Install gcovr
        run: pipx install gcovr
      - name: Configure + build + test (instrumented)
        run: |
          cmake --preset linux-coverage
          cmake --build --preset linux-coverage
          ctest --preset linux-coverage
      - name: Enforce ≥90% line coverage on core/ (hand-written sources)
        run: |
          gcovr --root . --filter 'core/' --exclude '.*/gen/.*' \
            build/linux-coverage --txt-metric line \
            --fail-under-line 90 --print-summary
      - name: Conformance matrix (profiles 0–7, no holes)
        run: python3 tools/conformance_matrix.py --output conformance-matrix.json
      - name: Upload conformance matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix
          path: conformance-matrix.json

  # --- Lint: formatting + fixtures freshness --------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - name: Install clang-format
        run: pipx install "clang-format~=21.1"
      - name: Check formatting
        run: |
          files=$(find core imos incs capi store transports tools tests -type f \
            \( -name '*.cpp' -o -name '*.h' \) -not -path '*/gen/*')
          clang-format --dry-run --Werror $files
      - name: Check generated code is up to date with the schemas
        run: |
          python3 tools/codegen/gen_messages.py fixtures/schema/mos4.dtd \
            tools/codegen/annotations.json core
          git diff --exit-code -- core \
            || { echo "::error::generated code is stale; rerun tools/codegen/gen_messages.py"; exit 1; }
      - name: Check fixtures are up to date with the spec
        run: |
          python3 tools/extract_fixtures.py "reference/MOS Protocol 4.0 (Current).html" fixtures
          git diff --exit-code -- fixtures \
            || { echo "::error::fixtures are stale; regenerate with tools/extract_fixtures.py"; exit 1; }
